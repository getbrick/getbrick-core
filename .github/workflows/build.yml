name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  MAVEN_ARGS: -B -ntp --strict-checksums

jobs:
  build:
    name: JDK ${{ matrix.java }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['25']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml', '.mvn/**') }}
          restore-keys: ${{ runner.os }}-m2-

      # The parent POM and the BOM come from getbrick-build, which is versioned in lockstep.
      # A shallow clone is enough; snapshots are resolved from GitHub Packages when available.
      - name: Install parent and BOM
        run: |
          git clone --depth 1 "https://github.com/getbrick/getbrick-build.git" ../getbrick-build
          (cd ../getbrick-build && ./mvnw -B -ntp -DskipTests install)

      - name: Verify
        run: ./mvnw $MAVEN_ARGS verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            **/target/site/jacoco/jacoco.xml
          retention-days: 7
          if-no-files-found: ignore

  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml', '.mvn/**') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Install parent and BOM
        run: |
          git clone --depth 1 "https://github.com/getbrick/getbrick-build.git" ../getbrick-build
          (cd ../getbrick-build && ./mvnw -B -ntp -DskipTests install)

      - name: SpotBugs, coverage floor and dependency analysis
        run: ./mvnw $MAVEN_ARGS -Pquality verify

      - name: Dependency convergence
        run: ./mvnw $MAVEN_ARGS -Pstrict -DskipTests validate

  config-drift:
    name: Build config drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          repository: getbrick/getbrick-build
          path: getbrick-build

      - name: config/ must match getbrick-build
        run: ./getbrick-build/scripts/install-build-config.sh "$GITHUB_WORKSPACE" --check

  reproducible:
    name: Reproducible build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml', '.mvn/**') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Install parent and BOM
        run: |
          git clone --depth 1 "https://github.com/getbrick/getbrick-build.git" ../getbrick-build
          (cd ../getbrick-build && ./mvnw -B -ntp -DskipTests install)

      - name: Build twice and compare checksums
        shell: bash
        run: |
          set -euo pipefail
          check() {
            ./mvnw -B -ntp -DskipTests -Dcheckstyle.skip -Dspotless.check.skip -Denforcer.skip clean package
            find . -name '*.jar' -path '*/target/*' -not -name '*-sources.jar' -not -name '*-javadoc.jar' \
              | sort | xargs --no-run-if-empty sha256sum | sed 's#\./##'
          }
          check > /tmp/first.txt
          check > /tmp/second.txt
          if ! diff -u /tmp/first.txt /tmp/second.txt; then
            echo "::error::Build is not reproducible: artifact checksums differ between runs."
            exit 1
          fi
          if [ ! -s /tmp/first.txt ]; then
            echo "::error::No jar artifacts were produced, so nothing was actually verified."
            exit 1
          fi
          echo "Reproducible build verified for $(wc -l < /tmp/first.txt) artifact(s)."
